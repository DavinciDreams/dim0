services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15.19
    restart: unless-stopped
    environment:
      POSTGRES_DB: topix
      POSTGRES_USER: topix
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0@sha256:79e5fcd19ab227ed36323fa5fa31820d14d53efc4f073417ba37be7931c7af0a
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_API_DOCS: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_DEBUG_ERROR_DETAILS: "false"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 1
      DOCLING_SERVE_MAX_SOURCES_PER_REQUEST: 1
      DOCLING_SERVE_MAX_FILE_SIZE: 26214400
      DOCLING_SERVE_MAX_NUM_PAGES: 200
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: 150
      UVICORN_WORKERS: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1073741824
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    pids_limit: 256
    mem_limit: 8g
    cpus: 4.0
    networks:
      - docling-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8081
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
      JWT_SECRET_KEY: ${SERVICE_REALBASE64_64_BACKEND}
      APP_BASE_URL: ${APP_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DOCLING_API_URL: http://docling:5001
      LINKUP_API_KEY: ${LINKUP_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-false}
      GOOGLE_CONNECT_ENABLED: ${GOOGLE_CONNECT_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_ID: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/utils/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - backend_data:/app/data
    networks:
      - default
      - docling-internal

volumes:
  qdrant_data:
  pg_data:
  redis_data:
  backend_data:

networks:
  docling-internal:
    internal: true
